name: Backstage CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: laptop1

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'yarn'

      - name: Build backstage app
        run: |
          yarn install --immutable
          yarn tsc
          yarn build:backend
